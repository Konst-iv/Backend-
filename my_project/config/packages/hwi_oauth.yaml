hwi_oauth:
    firewall_names: [main]  
    
    resource_owners:
        yandex:
            type:                yandex
            client_id:           '%env(OAUTH_YANDEX_CLIENT_ID)%'
            client_secret:       '%env(OAUTH_YANDEX_CLIENT_SECRET)%'
            scope:               "login:info login:email"
    